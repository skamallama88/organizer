[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "organizer"
version = "0.1.0"
description = "Safe file organization daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
organizer = "organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "types-pyyaml>=6.0,<7",
]
